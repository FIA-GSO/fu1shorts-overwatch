openapi: 3.0.0
info:
  title: Shorts API
  version: 1.0.0

paths:
  /shorts:
    get:
      summary: Get All Shorts
      responses:
        '200':
          description: List of shorts
    post:
      summary: Post Short
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
      responses:
        '201':
          description: Short created

  /shorts/{id}:
    get:
      summary: Get Short
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A single short

    delete:
      summary: Delete Short
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Short deleted

    put:
      summary: Replace Short
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
      responses:
        '200':
          description: Short replaced

    patch:
      summary: Update Short
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
      responses:
        '200':
          description: Short updated
